name: Build and Publish Astro Artifact

on:
  push:
    branches:
      - astro-migration
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist
          retention-days: 14

      - name: Publish dist to site-artifacts branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site-artifacts
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          commit_message: "chore: publish site artifact from ${{ github.ref_name }} @ ${{ github.sha }}"
